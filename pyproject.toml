[project]
name = "agenttrace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kelvin Oteyo", email = "oteyikelvin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agentsec-bench",
]

[project.scripts]
agenttrace = "agenttrace:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
agentsec-bench = { path = "../agentsec-bench", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
